name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs (full + play)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFullDebug assemblePlayDebug assembleFullRelease

      - name: Upload Full APKs
        uses: actions/upload-artifact@v4
        with:
          name: SFDM-full
          path: |
            app/build/outputs/apk/full/debug/*.apk
            app/build/outputs/apk/full/release/*.apk

      - name: Upload Play debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SFDM-play-debug
          path: app/build/outputs/apk/play/debug/*.apk
