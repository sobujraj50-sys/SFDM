name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KS_B64: ${{ secrets.SFDM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sfdm.jks"
            echo "SFDM_KEYSTORE_PATH=$RUNNER_TEMP/sfdm.jks" >> "$GITHUB_ENV"
            echo "Stable signing key found"
          else
            echo "::warning::No SFDM_KEYSTORE_BASE64 secret - APKs use a temporary debug key"
          fi

      - name: Build APKs (full + play)
        env:
          SFDM_KEYSTORE_PASSWORD: ${{ secrets.SFDM_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFullDebug assemblePlayDebug assembleFullRelease

      - name: Upload Full APKs
        uses: actions/upload-artifact@v4
        with:
          name: SFDM-full
          path: |
            app/build/outputs/apk/full/debug/*.apk
            app/build/outputs/apk/full/release/*.apk

      - name: Upload Play debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SFDM-play-debug
          path: app/build/outputs/apk/play/debug/*.apk
